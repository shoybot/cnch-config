# local.yml
---
- name: Configure Dojo Laptop
  hosts: localhost
  connection: local
  become: true
  vars:
    mcreator_version: "2026.2.33518"
    mcreator_url: "https://github.com/MCreator/MCreator/releases/download/2026.2.33518/MCreator.2026.2.Linux.64bit.tar.gz"

  tasks:
    # System-level APT packages (for all users)
    - name: Install baseline system packages
      ansible.builtin.apt:
        name:
          - git
          - vim
          - unattended-upgrades
        state: present
        update_cache: true

    # Unwanted packages (for all users)
    - name: Remove unwanted packages
      ansible.builtin.apt:
        name:
          - hexchat
        state: absent

    # Flatpak apps (for all users)
    - name: Install Flatpak applications
      community.general.flatpak:
        name:
          - org.mozilla.firefox
        state: present

    # "Ninja" account settings
    - name: Set Cinnamon desktop preferences for Ninja
      become: true
      become_user: ninja
      community.general.dconf:
        key: "/org/cinnamon/desktop/interface/clock-show-date"
        value: "true"
        state: present

    # Install MCreator
    - name: Ensure /opt/mcreator directory exists
      ansible.builtin.file:
        path: /opt/mcreator
        state: directory
        mode: '0755'

    - name: Download and extract MCreator
      ansible.builtin.unarchive:
        src: "{{ mcreator_url }}"
        dest: /opt/mcreator
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: /opt/mcreator/mcreator.sh

    - name: Add MCreator shortcut to Applications 
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/mcreator.desktop"
        dest: /usr/share/applications/mcreator.desktop
        mode: '0644'
